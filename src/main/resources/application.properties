# Application Name
spring.application.name=shelfLife

# Importing Env properties
spring.config.import=optional:file:.env[.properties]

# Datasource Configuration
spring.datasource.url=${DB_STRING}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logger Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n
logging.level.root=warn
logging.level.com.spring.shelfLife=info
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error

# Jwt Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Server Configuration
server.port=${PORT:8080}
