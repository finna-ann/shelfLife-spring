spring:
  config:
    import:
      - optional:file:.env[.properties]

  application:
    name: shelfLife

  datasource:
    url: ${DB_STRING}
    username: ${DB_USER}
    password : ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}


